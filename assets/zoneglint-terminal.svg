<svg xmlns="http://www.w3.org/2000/svg" width="1172" height="334" viewBox="0 0 1172 334" role="img" aria-labelledby="title desc">
<title id="title">Zoneglint live DNS comparison</title>
<desc id="desc">Captured from a live Zoneglint terminal query to Cloudflare and Google public DNS resolvers for example.com.</desc>
<rect width="100%" height="100%" rx="12" fill="#0d1117"/><rect x="0.5" y="0.5" width="1171" height="333" rx="12" fill="none" stroke="#30363d"/>
<g font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="15px" xml:space="preserve">
<text x="22.0" y="20.0" dominant-baseline="hanging" fill="#e6edf3" font-weight="400">┌ Zoneglint ───────────────────────────────────────────────────────────────────────────────────────────────────────────┐</text>
<text x="22.0" y="41.0" dominant-baseline="hanging" fill="#e6edf3" font-weight="400">│example.com · A · 4/4 resolvers                                                                                       │</text>
<text x="22.0" y="62.0" dominant-baseline="hanging" fill="#e6edf3" font-weight="400">└──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┘</text>
<text x="22.0" y="83.0" dominant-baseline="hanging" fill="#e6edf3" font-weight="400">┌ Resolver results ────────────────────────────────────────────────────────────────────────────────────────────────────┐</text>
<text x="22.0" y="104.0" dominant-baseline="hanging" fill="#e6edf3" font-weight="400">│</text>
<text x="31.4" y="104.0" dominant-baseline="hanging" fill="#e6edf3" font-weight="700">SERVER                   IP               ANSWER / ERROR                                                    LATENCY   </text>
<text x="1140.6" y="104.0" dominant-baseline="hanging" fill="#e6edf3" font-weight="400">│</text>
<text x="22.0" y="125.0" dominant-baseline="hanging" fill="#e6edf3" font-weight="400">│Google Public DNS        8.8.8.8          NOERROR: 104.20.23.154, 172.66.147.243                            15 ms     │</text>
<text x="22.0" y="146.0" dominant-baseline="hanging" fill="#e6edf3" font-weight="400">│Google Public DNS        8.8.4.4          NOERROR: 104.20.23.154, 172.66.147.243                            15 ms     │</text>
<text x="22.0" y="167.0" dominant-baseline="hanging" fill="#e6edf3" font-weight="400">│Cloudflare               1.1.1.1          NOERROR: 104.20.23.154, 172.66.147.243                            10 ms     │</text>
<text x="22.0" y="188.0" dominant-baseline="hanging" fill="#e6edf3" font-weight="400">│Cloudflare               1.0.0.1          NOERROR: 104.20.23.154, 172.66.147.243                            11 ms     │</text>
<text x="22.0" y="209.0" dominant-baseline="hanging" fill="#e6edf3" font-weight="400">│                                                                                                                      │</text>
<text x="22.0" y="230.0" dominant-baseline="hanging" fill="#e6edf3" font-weight="400">└──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┘</text>
<text x="22.0" y="251.0" dominant-baseline="hanging" fill="#e6edf3" font-weight="400">┌──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┐</text>
<text x="22.0" y="272.0" dominant-baseline="hanging" fill="#e6edf3" font-weight="400">│Propagation: 4/4 (100.0%) · NOERROR: 104.20.23.154, 172.66.147.243 · Ctrl-C to stop                                   │</text>
<text x="22.0" y="293.0" dominant-baseline="hanging" fill="#e6edf3" font-weight="400">└──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┘</text>
</g></svg>
